name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Expense.Logger.slnx

      - name: Build
        run: dotnet build Expense.Logger.slnx --no-restore --configuration Release

      # Add a "dotnet test" step here once a test project exists.
